name: 新规则 / 新功能建议
description: 想要一条新的优化规则，或者新的使用场景
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新规则只需要三步：在 `rules.py` 加一个函数 → 注册进 `RULES` → 补一条测试。
        如果你愿意直接提 PR 就更好了。

  - type: textarea
    id: scenario
    attributes:
      label: 你想解决的场景
      description: 什么样的输入，你希望工具多做点什么？
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 期望的规则
      description: 你希望这条规则往输出里补什么、删什么？
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: 你是否愿意提 PR
      options:
        - label: 我可以自己实现这条规则
          required: false
