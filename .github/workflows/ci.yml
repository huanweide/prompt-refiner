name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试 · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑测试
        run: pytest -q

      - name: 冒烟测试 —— 单文件版必须能独立运行
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # 直接用参数传中文，避免 Windows 下管道编码转换问题
          OUT=$(python standalone/prompt_refiner.py "帮我写个爬虫抓B站数据 谢谢")
          echo "$OUT" | head -5
          # 断言关键结构必须出现
          echo "$OUT" | grep -q "# 任务" || { echo "缺少 # 任务 节"; exit 1; }
          echo "$OUT" | grep -q "# 约束" || { echo "缺少 # 约束 节"; exit 1; }
          echo "单文件版冒烟测试通过"

  lint:
    name: 代码规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 编译检查全部源码
        run: |
          python -m compileall -q src standalone tests
          echo "全部文件编译通过"

      - name: 检查单文件版零第三方依赖
        run: |
          if grep -E "^\s*(import|from)\s+(requests|openai|numpy|pandas|click|rich)" standalone/prompt_refiner.py; then
            echo "错误：单文件版引入了第三方依赖"
            exit 1
          fi
          echo "单文件版保持零依赖"

      # 之前 src 包与 standalone 单文件版是两份各写各的实现，
      # 实测 12 条常见输入里有 4 条输出不一致，而原有的一致性测试
      # 只覆盖了 1 条恰好一致的输入，等于没测。
      # 现在单文件版由 scripts/build_standalone.py 生成，这一步兜底：
      # 任何人手改了 standalone 而没重新生成，CI 立刻失败。
      - name: 单文件版必须与 src 源码完全一致
        run: |
          python scripts/build_standalone.py --check

      # 仓库曾经把 Homepage/Repository/Issues 全指向 huanweide/prompt-forge，
      # 而那个仓库并不存在 —— PyPI 页面上三个链接全是 404。
      # 这类「别的项目 / 旧名字残留」只在对外发布后才暴露，必须在 CI 里拦住。
      - name: 检查项目元数据里没有指向别的仓库的链接
        run: python scripts/check_metadata.py
