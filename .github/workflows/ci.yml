name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试 · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑测试
        run: pytest -q

      - name: 冒烟测试 —— 单文件版必须能独立运行
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # 直接用参数传中文，避免 Windows 下管道编码转换问题
          OUT=$(python standalone/prompt_refiner.py "帮我写个爬虫抓B站数据 谢谢")
          echo "$OUT" | head -5
          # 断言关键结构必须出现
          echo "$OUT" | grep -q "# 任务" || { echo "缺少 # 任务 节"; exit 1; }
          echo "$OUT" | grep -q "# 约束" || { echo "缺少 # 约束 节"; exit 1; }
          echo "单文件版冒烟测试通过"

  lint:
    name: 代码规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 编译检查全部源码
        run: |
          python -m compileall -q src standalone tests
          echo "全部文件编译通过"

      - name: 检查单文件版零第三方依赖
        run: |
          if grep -E "^\s*(import|from)\s+(requests|openai|numpy|pandas|click|rich)" standalone/prompt_refiner.py; then
            echo "错误：单文件版引入了第三方依赖"
            exit 1
          fi
          echo "单文件版保持零依赖"
