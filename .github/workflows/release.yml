name: Release to PyPI

# 触发方式：打 tag（如 v0.1.0）自动发布，或手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建分发包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build twine

      - name: 跑测试（发布前必须全绿）
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 校验分发包
        run: twine check dist/*

      - name: 冒烟测试 —— 装的 whl 能跑
        run: |
          pip install dist/*.whl
          prompt-refiner "写个爬虫抓B站数据 谢谢" | head -3
          prompt-refiner --score "总结这篇文章"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    # 需要先在 PyPI 配置 Trusted Publisher，指向本仓库的 release.yml
    environment:
      name: pypi
      url: https://pypi.org/p/prompt-refiner
    permissions:
      id-token: write   # Trusted Publishing 必需（免 API token）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 首次发布可先去掉注释，只传测试源验证流程
          # repository-url: https://test.pypi.org/legacy/
          skip-existing: true
