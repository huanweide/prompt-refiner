[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrefiner"
version = "0.1.0"
description = "把任意文字自动优化成结构清晰、省 token、不丢原意的提示词。纯本地规则引擎，零依赖。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ReTri", email = "huanweide@users.noreply.github.com" }]
keywords = ["prompt", "prompt-engineering", "llm", "optimizer", "cli", "cli-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/huanweide/prompt-forge"
Repository = "https://github.com/huanweide/prompt-forge"
Issues = "https://github.com/huanweide/prompt-forge/issues"

[project.scripts]
prompt-refiner = "promptrefiner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
